<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Symbols+Rounded&display=swap" />
  <link rel="icon" type="image/png" href="/webinterface/favicon.png" />
  <link rel="shortcut icon" type="image/png" href="/webinterface/favicon.png" />
  <title>flow.io</title>
  <script>
    (function () {
      var theme = 'light';
      try {
        theme = localStorage.getItem('flow_web_theme') === 'dark' ? 'dark' : 'light';
      } catch (err) {}
      document.documentElement.setAttribute('data-theme', theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
  <style>
    :root {
      --boot-bg: #0B1F3A;
      --boot-fg: #FFFFFF;
      --boot-muted: rgba(255,255,255,0.82);
      --boot-error: #FFD5DB;
    }
    html[data-theme="light"] {
      --boot-bg: #F8FAFC;
      --boot-fg: #071A35;
      --boot-muted: rgba(7,26,53,0.72);
      --boot-error: #B4233A;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--boot-bg);
      color: var(--boot-fg);
      font-family: "Inter", "Segoe UI", Roboto, Arial, sans-serif;
    }
    #app-root {
      min-height: 100vh;
    }
    #app-root.is-booting {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .boot-status {
      font-size: 14px;
      color: var(--boot-muted);
    }
    .boot-status.error {
      color: var(--boot-error);
    }
  </style>
</head>
<body>
  <div id="app-root" class="is-booting"><div id="bootStatus" class="boot-status">Chargement de l'interface...</div></div>
  <script src="/webinterface/app-core.js"></script>
  <script>
    (function () {
      if (window.FlowWebCore && typeof window.FlowWebCore.bootstrap === 'function') {
        window.FlowWebCore.bootstrap();
      }
    })();
  </script>
</body>
</html>
